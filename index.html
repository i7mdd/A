<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عالم لها وحدها</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&family=Great+Vibes&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--m:#171326;--p:#49365F;--l:#A991C2;--w:#E9DFE8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--m);color:var(--w);font-family:Tajawal,sans-serif}
button,input,label{font:inherit;color:inherit}
button{background:rgba(169,145,194,.18);border:1px solid var(--l);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{background:rgba(169,145,194,.35)}button:focus-visible,input:focus-visible{outline:2px solid var(--w)}
#sky{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0,#2b2147,var(--m) 72%)}
#stars{position:absolute;inset:0;animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.55}}
.fog{position:absolute;width:140vw;height:40vh;background:radial-gradient(ellipse,rgba(169,145,194,.13),transparent 70%);animation:dr 40s linear infinite alternate}
@keyframes dr{to{transform:translateX(-30vw)}}
#world{position:absolute;left:0;top:0;width:2600px;height:1500px;transform-origin:0 0;transition:transform 2.4s cubic-bezier(.6,0,.2,1)}
#paths{position:absolute;inset:0}
#paths path{fill:none;stroke:#49365F;stroke-width:3;stroke-dasharray:4 14;transition:stroke .8s}
#paths path.on{stroke:var(--l);stroke-width:4;filter:drop-shadow(0 0 8px var(--l));animation:fl2 3s linear infinite}
@keyframes fl2{to{stroke-dashoffset:-36}}
.isl{position:absolute;width:280px;height:230px;margin:-115px 0 0 -140px;cursor:pointer;transition:filter 1s}
@keyframes fl{to{transform:translateY(-16px)}}
.isl .top{position:absolute;top:36px;left:10px;right:10px;height:96px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,var(--l),var(--p) 72%)}
.isl .rock{position:absolute;top:86px;left:34px;right:34px;height:130px;background:linear-gradient(#3a2c4f,#171326);clip-path:polygon(0 0,100% 0,72% 62%,50% 100%,28% 66%)}
.isl svg{position:absolute;top:-6px;left:95px;width:90px;height:90px;stroke:var(--w);fill:none;stroke-width:3}
.isl .lb{position:absolute;bottom:-34px;width:100%;text-align:center;font-weight:700;font-size:22px}
.isl.lk{filter:grayscale(.9) brightness(.45)}
.isl.nx{filter:drop-shadow(0 0 30px rgba(169,145,194,.7))}
.isl small{display:block;font-weight:300;font-size:15px;color:var(--l)}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;z-index:5;gap:8px}
#dots{display:flex;gap:7px;align-items:center;font-size:14px;color:var(--l)}
#dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--l)}#dots i.f{background:var(--w);border-color:var(--w);box-shadow:0 0 10px var(--w)}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 40%,#2b2147,var(--m));text-align:center;transition:opacity 1.5s}
#intro h1{font-weight:300;font-size:clamp(34px,8vw,72px);letter-spacing:.02em}#intro p{color:var(--l);font-size:18px}
#intro button{padding:12px 38px;font-size:19px}
#st{position:fixed;inset:0;z-index:10;background:rgba(23,19,38,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:12px}
#st.on{display:flex;animation:fi .5s}@keyframes fi{from{opacity:0}}
.pn{position:relative;width:min(96vw,480px);max-height:94vh;overflow:auto;background:linear-gradient(#2a2040,#1d1730);border:1px solid var(--p);border-radius:18px;padding:22px 18px;box-shadow:0 20px 80px #000}
.pn h2{font-weight:500;margin-bottom:6px;font-size:24px}.hn{color:var(--l);font-size:15px;margin:6px 0 12px;font-weight:300}
.x{position:absolute;top:10px;left:10px;padding:2px 11px;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--w);color:var(--m);padding:10px 22px;border-radius:30px;z-index:30;opacity:0;transition:opacity .5s;pointer-events:none;font-weight:500}
#toast.on{opacity:1}
.gb{direction:ltr;background:linear-gradient(145deg,rgba(220,150,200,.75),rgba(110,80,170,.8));border-radius:18px 18px 70px 18px;padding:18px;max-width:330px;margin:auto;box-shadow:inset 0 0 30px rgba(255,255,255,.3),0 10px 30px #0008}
.scr{background:#9bbc0f;border:8px solid #2a2a3a;border-radius:8px 8px 30px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;image-rendering:pixelated;position:relative;min-height:190px}
.cd{aspect-ratio:1;background:#306230;display:grid;place-items:center;font-size:28px;color:#0f380f;font-family:monospace;border:3px solid #0f380f}.cd.o{background:#8bac0f}.cd.c{outline:4px solid #e9dfe8;outline-offset:-1px}
.scr .ms{position:absolute;inset:0;display:grid;place-items:center;background:#0f380fdd;color:#9bbc0f;font-size:26px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.dp{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}.dp b,.ab b{background:#2a2a3a;cursor:pointer;touch-action:manipulation;user-select:none}
.ab{display:flex;gap:12px;transform:rotate(-20deg)}.ab b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--l)}
.ss{display:flex;gap:12px;justify-content:center;margin-top:10px}.ss b{background:#2a2a3a;width:44px;height:11px;border-radius:6px;transform:rotate(-20deg);cursor:pointer}
.rd{background:linear-gradient(#5b4573,#3a2c4f);border-radius:16px;padding:16px;border:2px solid var(--l)}
.dsp{background:#10091c;border-radius:10px;padding:12px;text-align:center}.fr{font-size:38px;font-family:monospace;color:var(--w);direction:ltr}
.bars{display:flex;gap:3px;height:44px;align-items:flex-end;direction:ltr}.bars i{flex:1;background:var(--l);height:4px;transition:height .12s}
input[type=range]{width:100%;accent-color:var(--l)}
.bt{position:relative;width:260px;height:338px;margin:auto;border:10px solid #3a2c4f;border-radius:10px;overflow:hidden;background:#10091c}
.bt video,.bt img{width:100%;height:100%;object-fit:cover}.bt .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.bt .fl.on{animation:sh .5s}
@keyframes sh{0%{opacity:1}100%{opacity:0}}
#po canvas{width:240px;display:block;margin:12px auto;box-shadow:0 8px 30px #000;animation:dv 4s ease-out forwards,pr .8s}
@keyframes dv{from{filter:brightness(0) blur(8px)}to{filter:none}}@keyframes pr{from{transform:translateY(-60px);opacity:0}}
.pz{display:grid;grid-template-columns:repeat(3,86px);gap:3px;justify-content:center;margin:12px 0}.pz div{width:86px;height:86px;cursor:pointer;background-size:258px 258px;border-radius:3px}.pz div.s{outline:3px solid var(--w)}
.pd{position:relative}.pd canvas{width:100%;border-radius:12px;display:block;touch-action:none}
.env{position:absolute;right:14px;bottom:14px;width:78px;height:52px;background:var(--w);border-radius:4px;opacity:0;pointer-events:none;transition:opacity 2s;cursor:pointer;animation:fl 3s ease-in-out infinite alternate;box-shadow:0 4px 14px #000}
.env::before{content:"";position:absolute;inset:0;background:#cfc0d2;clip-path:polygon(0 0,100% 0,50% 60%)}.env::after{content:"";position:absolute;left:50%;top:48%;width:12px;height:12px;border-radius:50%;background:var(--p);transform:translate(-50%,-50%)}
.env.on{opacity:1;pointer-events:auto}
.tt{display:flex;gap:16px;align-items:center;background:#10091c;border-radius:14px;padding:12px;margin-top:12px;direction:ltr}
.tn{position:relative;width:130px;height:130px;flex:none}.rec{width:120px;height:120px;border-radius:50%;background:repeating-radial-gradient(#0c0814 0 3px,#1c1430 4px 6px);border:3px solid #2a2040;animation:sp 3s linear infinite;animation-play-state:paused;position:relative}
.rec::after{content:"";position:absolute;inset:40px;border-radius:50%;background:var(--l)}.rec.on{animation-play-state:running}@keyframes sp{to{transform:rotate(360deg)}}
.arm{position:absolute;top:2px;right:-6px;width:6px;height:90px;background:var(--w);border-radius:3px;transform-origin:50% 0;transition:transform .2s}
.lt{position:absolute;inset:0;background:var(--w);color:var(--m);border-radius:18px;padding:30px 24px;overflow:auto;animation:fi .8s;line-height:2;font-size:18px}.lt button{color:var(--m);border-color:var(--p);margin-top:16px}
.pol{background:var(--w);color:var(--m);width:250px;margin:10px auto;padding:12px 12px 16px;box-shadow:0 8px 24px #000;animation:pr .8s;text-align:center}
.pol .im{width:226px;height:226px;background:#3a2c4f center/cover;display:grid;place-items:center;color:var(--l);cursor:pointer}
.pol [contenteditable]{min-height:26px;outline:0;border-bottom:1px dashed var(--l);margin-top:8px}
.fs{height:200px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#e9dfe888 0 4%,transparent 30%),linear-gradient(#171326,#49365F);position:relative;overflow:hidden;margin-bottom:12px}
.fs::before{content:"";position:absolute;left:50%;top:22px;width:50px;height:50px;border-radius:50%;background:var(--w);box-shadow:0 0 60px 20px #a991c2aa;transform:translateX(-50%)}
.fs::after{content:"";position:absolute;bottom:0;left:20%;right:20%;height:50px;background:#0e0a1a;border-radius:50% 50% 0 0}
@media(prefers-reduced-motion:reduce){.gl::after,.lcd .cd.c{animation:none!important}}

.fw{position:absolute;inset:0;animation:fl 6s ease-in-out infinite alternate;animation-delay:var(--dl,0s);will-change:transform}
.isl.lk .top{background:radial-gradient(ellipse at 50% 30%,#5d4d73,#2a2040 72%)}.isl.lk .lb{opacity:.6}.isl.nx .top{box-shadow:0 0 60px 10px rgba(169,145,194,.55)}.fog{will-change:transform}
.gl{position:absolute;left:-8px;right:-8px;top:18px;height:200px;z-index:3;display:grid;place-items:center;border-radius:50% 50% 45% 55%/55% 45% 55% 45%;background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(169,145,194,.14) 55%,rgba(255,255,255,.22));border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 12px 26px rgba(255,255,255,.4),inset 0 -16px 30px rgba(73,54,95,.55),0 0 40px rgba(169,145,194,.3);animation:lq 7s ease-in-out infinite alternate}
.isl .gl svg{position:static;width:50px;height:50px;stroke:#E9DFE8;stroke-width:4}
@keyframes lq{50%{border-radius:42% 58% 55% 45%/48% 52% 48% 52%}100%{border-radius:58% 42% 45% 55%/52% 48% 52% 48%}}
.gl.melt{animation:mt 2s ease-in forwards}@keyframes mt{40%{transform:scale(1.04,.9);opacity:.9}to{transform:translateY(90px) scale(1.3,.05);opacity:0}}.gl.gone{display:none}
.pn{width:min(96vw,540px)}
.gb{width:310px;max-width:none;padding:20px 22px 34px;border-radius:16px 16px 84px 16px;background:linear-gradient(150deg,rgba(255,170,220,.6),rgba(150,110,220,.65) 60%,rgba(90,70,170,.75));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 2px 3px rgba(255,255,255,.6),inset 0 -10px 22px rgba(40,20,80,.5),0 18px 40px #000a;position:relative}
.gbt{display:flex;justify-content:space-between;font-size:12px;color:rgba(40,20,80,.8);margin-bottom:8px}.led{width:9px;height:9px;border-radius:50%;background:#ff4466;box-shadow:0 0 10px #f46;margin-top:3px}
.bz{background:#3b3550;border-radius:10px 10px 44px 10px;padding:16px 22px 24px;box-shadow:inset 0 3px 8px #000a}
.lcd{background:#9bbc0f;aspect-ratio:10/9;border-radius:3px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:5px;padding:8px;position:relative;box-shadow:inset 0 0 16px rgba(15,56,15,.6);overflow:hidden;min-height:0;border:0}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(15,56,15,.12) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(15,56,15,.08) 0 1px,transparent 1px 3px)}
.lcd .cd{aspect-ratio:auto;background:#8bac0f;border:2px solid #306230;font-size:inherit;cursor:pointer;outline:0}.lcd .cd.o{background:#c4d86a}.lcd .cd.c{outline:3px solid #0f380f;outline-offset:-1px;animation:bk .7s steps(2) infinite}.cd svg{fill:#0f380f}.cd .q{color:#306230;font:700 20px monospace}
@keyframes bk{50%{outline-color:transparent}}@keyframes dp{from{transform:translateY(-70px)}}
.ms{grid-column:1/5;grid-row:1/4;background:#0f380f;color:#9bbc0f;display:grid;place-items:center;text-align:center;font-size:26px;position:relative;z-index:2;position:relative;inset:auto;font-weight:700}.ms svg{fill:#9bbc0f;width:30px}
.lg{font-weight:700;font-style:italic;letter-spacing:.12em;color:rgba(40,20,80,.8);margin:12px 4px 0;font-size:20px}
.gb .ctl{margin-top:8px}.gb .dp{display:block;grid-template-columns:none;width:96px;height:96px;position:relative;background:#2a2540;clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%)}.gb .dp b{position:absolute;background:none}.gb .dp b:active{background:#4a4268}
.gb .ab{gap:14px;transform:rotate(-24deg);margin-top:20px}.gb .ab b{width:54px;height:54px;background:radial-gradient(circle at 35% 30%,#ff7ab8,#b0206a);box-shadow:0 5px 0 #6a1040,0 8px 12px #0007;color:rgba(255,255,255,.7);font-size:13px}.gb .ab b:active{transform:translateY(4px);box-shadow:0 1px 0 #6a1040}
.gb .ss{justify-content:flex-start;gap:20px;margin:18px 0 0 40px}.gb .ss b{background:#2a2540;width:48px;height:12px;border-radius:7px;transform:rotate(-24deg)}
.spk{position:absolute;right:24px;bottom:22px;display:flex;gap:7px;transform:rotate(-28deg)}.spk i{width:5px;height:44px;border-radius:3px;background:rgba(40,20,80,.55);box-shadow:inset 0 1px 2px #0008}
.rx{background:linear-gradient(145deg,#5b4573,#2a2040 70%);border:2px solid var(--l);border-radius:26px;padding:16px;box-shadow:inset 0 2px 2px rgba(255,255,255,.35),inset 0 -10px 24px #0007,0 16px 40px #000a}
.rt{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:10px;letter-spacing:.05em}
.lamp,.tl{width:12px;height:12px;border-radius:50%;background:#3a2c4f;box-shadow:inset 0 1px 3px #000;display:inline-block}.rx.on .lamp{background:#ffd98a;box-shadow:0 0 14px #ffd98a}.tl.on{background:#9dffb0;box-shadow:0 0 12px #9dffb0}
.rm{display:grid;grid-template-columns:1fr 1.7fr;gap:12px}.grl{border-radius:14px;min-height:110px;background:repeating-linear-gradient(90deg,#120c1e 0 3px,#3d2f55 3px 6px);border:2px solid var(--l);box-shadow:inset 0 0 20px #000}
.win{border-radius:14px;border:2px solid var(--l);background:#120c1e;padding:12px 10px 8px;transition:background .8s;overflow:hidden}.rx.on .win{background:linear-gradient(#efe4c9,#b99fd0);box-shadow:0 0 30px rgba(233,223,232,.35),inset 0 0 20px rgba(73,54,95,.5)}
.tk{height:46px;background:repeating-linear-gradient(90deg,var(--p) 0 2px,transparent 2px 9px)}.ndl{position:absolute;top:-4px;bottom:-4px;width:3px;background:#e44;box-shadow:0 0 8px #f66;transition:left .1s}.nm{display:flex;justify-content:space-between;font:12px monospace;color:#8a74a3;direction:ltr;margin-top:6px}.rx.on .nm{color:var(--p)}
.kn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:16px 0 6px}.kb{text-align:center;font-size:13px}
.knob{width:68px;height:68px;border-radius:50%;margin:0 auto 4px;background:conic-gradient(#e9dfe8,#a991c2,#e9dfe8,#8a74a3,#e9dfe8);box-shadow:0 5px 0 #2a2040,0 8px 14px #000a,inset 0 0 0 5px #3a2c4f;position:relative;touch-action:none;cursor:grab}.knob i{position:absolute;top:7px;left:50%;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:#2a2040}
.dsp2{background:#0e0818;border-radius:12px;padding:8px;text-align:center;border:1px solid var(--p)}.rx.on .fr{text-shadow:0 0 12px var(--l)}.rx button{border-radius:20px}
.pz2{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(100%,270px);margin:10px auto}.pz2 div{aspect-ratio:260/338;background-size:300% 300%;cursor:pointer;border-radius:3px}.pz2 div.s{outline:3px solid var(--w);outline-offset:-3px}

.lg{font:400 52px/1 'Great Vibes',cursive;font-style:normal;letter-spacing:.02em;margin:10px 6px 0;color:#fff;text-shadow:0 2px 0 rgba(73,54,95,.6),0 0 14px rgba(255,255,255,.55)}
.ms .us{font:400 64px/1 'Great Vibes',cursive}

html,body{position:fixed;inset:0;width:100%;overscroll-behavior:none}
#vp{position:fixed;inset:0;overflow:hidden;direction:ltr;contain:layout paint}.isl{direction:rtl}
.gl{overflow:hidden}.gl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.4) 48%,transparent 60%);transform:translateX(-120%);animation:sh2 4.5s ease-in-out infinite}
@keyframes sh2{60%,100%{transform:translateX(120%)}}
.isl .gl svg{width:70px;height:84px;stroke:none;stroke-width:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.gl.melt .shk{transform:translateY(-14px) rotate(-14deg);transform-origin:70px 52px;transition:transform .5s}.gl.melt{animation-delay:.6s}
#intro h1.big{font:400 clamp(130px,30vw,280px)/1 'Great Vibes',cursive;letter-spacing:.02em;text-shadow:0 0 50px rgba(169,145,194,.65),0 4px 0 rgba(73,54,95,.6)}
.us2{font:400 46px/1 'Great Vibes',cursive;color:var(--w);text-shadow:0 0 18px rgba(169,145,194,.7);pointer-events:none}
.isl.lk .fw>svg{opacity:.2}

/* ===== gate ===== */
#gate{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(ellipse at 50% 35%,#2b2147,var(--m) 75%);transition:opacity 1.4s,visibility 1.4s;overflow:hidden;direction:rtl}
#gate.out{opacity:0;visibility:hidden}
#gate .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none}
#gate .o1{width:300px;height:300px;background:#6a4f8f;left:calc(50% - 280px);top:18%;animation:gdr 14s ease-in-out infinite alternate}
#gate .o2{width:240px;height:240px;background:#A991C2;left:calc(50% + 20px);top:30%;animation:gdr 11s ease-in-out infinite alternate-reverse}
@keyframes gdr{to{transform:translate(40px,-30px) scale(1.15)}}
#lock{position:relative;width:170px;height:210px;z-index:2;transition:transform .4s}
#lock.bad{animation:gsh .5s}
@keyframes gsh{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-9px)}80%{transform:translateX(5px)}}
#lock .shk{position:absolute;left:30px;top:0;width:110px;height:110px;transform-origin:30px 100px;transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
#lock.open .shk{transform:translateY(-20px) rotate(-32deg)}
#lock .bdy{position:absolute;left:0;right:0;bottom:0;height:136px;border-radius:44% 56% 42% 58%/46% 44% 56% 54%;background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(169,145,194,.16) 48%,rgba(255,255,255,.22));backdrop-filter:blur(14px) saturate(1.7);-webkit-backdrop-filter:blur(14px) saturate(1.7);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 3px 2px rgba(255,255,255,.75),inset 0 -22px 34px rgba(73,54,95,.5),inset 0 0 0 6px rgba(255,255,255,.05),0 34px 60px rgba(0,0,0,.5),0 0 60px rgba(169,145,194,.3);animation:gq 8s ease-in-out infinite alternate;overflow:hidden}
@keyframes gq{50%{border-radius:56% 44% 50% 50%/42% 56% 44% 58%}100%{border-radius:46% 54% 58% 42%/54% 44% 56% 46%}}
#lock .bdy::before{content:"";position:absolute;left:12%;top:8%;width:46%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));transform:rotate(-18deg)}
#lock .bdy::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.35) 50%,transparent 62%);transform:translateX(-130%);animation:sh2 5s ease-in-out infinite}
#lock .kh{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-12px 0 0 -15px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a2c4f,#120c1e);box-shadow:0 1px 0 rgba(255,255,255,.5),inset 0 2px 6px #000;transition:box-shadow .8s,background .8s}
#lock .kh::after{content:"";position:absolute;left:50%;top:70%;width:8px;height:20px;margin-left:-4px;border-radius:4px;background:#120c1e}
